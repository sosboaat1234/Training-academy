<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boon Edam Service Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  font-size: 12px;
  background: #6a8faf;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
}

/* ── Window shell ── */
.window {
  width: 900px;
  background: #f0f0f0;
  border: 1px solid #888;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
  display: flex; flex-direction: column;
}

/* ── Title bar ── */
.titlebar {
  background: linear-gradient(to bottom, #4a90c8 0%, #2060a0 100%);
  padding: 4px 6px;
  display: flex; align-items: center; justify-content: space-between;
  user-select: none; flex-shrink: 0;
}
.titlebar-left { display: flex; align-items: center; gap: 5px; }
.titlebar-icon {
  width: 16px; height: 16px;
  background: white;
  border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: bold; color: #1558a0; flex-shrink: 0;
}
.titlebar-text { color: white; font-size: 12px; }
.titlebar-btns { display: flex; gap: 2px; }
.wbtn {
  width: 20px; height: 16px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 1px; line-height: 1;
}
.wbtn:hover { background: rgba(255,255,255,0.4); }
.wbtn.x:hover { background: #c0392b; }

/* ── Body row: left panel + right content ── */
.body-row {
  display: flex;
  flex: 1;
  min-height: 580px;
}

/* ── Left quick menu ── */
.quick-menu {
  width: 110px;
  background: #f0f0f0;
  border-right: 1px solid #aaa;
  padding: 6px 0;
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.qm-btn {
  padding: 6px 10px;
  color: #006600;
  cursor: pointer;
  font-size: 11px;
  text-align: center;
  line-height: 1.3;
  border: none; background: none;
  font-family: inherit;
  width: 100%;
}
.qm-btn:hover { background: #ddeedd; color: #003300; }
.qm-btn:active { background: #bbddbb; }
.qm-btn.disabled { color: #aaa; cursor: default; }
.qm-btn.disabled:hover { background: none; color: #aaa; }
.qm-sep { height: 8px; }
.qm-dropdown {
  margin: 4px 8px;
  padding: 2px 4px;
  font-size: 11px;
  border: 1px solid #aaa;
  background: white;
  color: #333;
  font-family: inherit;
  width: calc(100% - 16px);
}
.qm-version {
  padding: 3px 10px;
  font-size: 10px;
  color: #555;
  text-align: left;
}
.qm-crc {
  padding: 4px 10px;
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: #aaa;
}
.qm-crc label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #555; }

/* ── Right: tab strip + content ── */
.right-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Tab strip ── */
.tab-strip {
  display: flex;
  background: #f0f0f0;
  border-bottom: 2px solid #aaa;
  padding: 4px 0 0 4px;
  flex-shrink: 0;
  flex-wrap: nowrap;
  overflow-x: auto;
}
.tab {
  padding: 4px 12px;
  border: 1px solid #bbb;
  border-bottom: none;
  background: #ddd;
  cursor: pointer;
  font-size: 11px;
  color: #333;
  white-space: nowrap;
  margin-right: 2px;
  border-radius: 3px 3px 0 0;
  position: relative; bottom: -2px;
}
.tab:hover { background: #e8e8e8; }
.tab.active {
  background: #f0f0f0;
  border-bottom: 2px solid #f0f0f0;
  font-weight: bold;
  color: #000;
  z-index: 1;
}
.tab.disabled { color: #bbb; cursor: default; }
.tab.disabled:hover { background: #ddd; }

/* ── Content panel ── */
.content {
  flex: 1;
  background: #f0f0f0;
  padding: 12px 14px;
  overflow-y: auto;
}

/* ── Status bar ── */
.statusbar {
  background: #f0f0f0;
  border-top: 1px solid #bbb;
  padding: 3px 8px;
  font-size: 11px; color: #333;
  display: flex; justify-content: space-between;
  flex-shrink: 0;
}

/* ── Setup: large icon buttons ── */
.app-info-box {
  border: 1px solid #aaa;
  padding: 8px 12px;
  margin-bottom: 16px;
  display: inline-block;
  min-width: 260px;
  background: white;
  position: relative;
}
.app-info-box legend {
  position: absolute; top: -8px; left: 8px;
  background: #f0f0f0;
  padding: 0 4px;
  font-size: 11px; color: #333;
}
.app-info-text {
  text-align: center;
  font-size: 12px;
  color: #333;
  padding: 4px 0;
  min-height: 22px;
}

.icon-btn-grid {
  display: grid;
  grid-template-columns: repeat(3, 90px);
  gap: 8px;
  margin-top: 4px;
}
.icon-btn {
  width: 90px; height: 78px;
  border: 1px solid #ccc;
  background: #f8f8f8;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  border-radius: 2px;
  transition: background 0.1s;
}
.icon-btn:hover { background: #e0eef8; border-color: #7aafe0; }
.icon-btn:active { background: #c8ddf0; }
.icon-btn.disabled { opacity: 0.4; cursor: not-allowed; }
.icon-btn.disabled:hover { background: #f8f8f8; border-color: #ccc; }
.icon-img { width: 40px; height: 40px; display: block; }
.icon-label {
  font-size: 11px;
  color: #006600;
  text-decoration: underline;
  text-align: center;
}

/* ── Update tab: wide buttons ── */
.update-btn {
  width: 320px; height: 60px;
  border: 1px solid #ccc;
  background: #f8f8f8;
  cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  margin-bottom: 6px;
  border-radius: 2px;
  font-size: 12px; color: #333;
  font-family: inherit;
}
.update-btn:hover { background: #e0eef8; border-color: #7aafe0; }
.update-btn .u-icon { width: 36px; height: 36px; }
.update-btn .u-label { color: #006600; text-decoration: underline; font-size: 12px; }

/* ── Config tab ── */
.config-group {
  border: 1px solid #aaa;
  margin-bottom: 12px;
  background: white;
  position: relative;
}
.config-group-title {
  position: absolute; top: -8px; left: 8px;
  background: white; padding: 0 4px; font-size: 11px; color: #333;
}
.config-body { padding: 14px 10px 10px; }
.cfg-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
.cfg-label { width: 140px; font-size: 11px; color: #333; flex-shrink: 0; }
.cfg-input {
  padding: 2px 4px; border: 1px solid #aaa;
  font-size: 11px; font-family: inherit;
  background: white;
}
.cfg-input:focus { outline: 1px solid #4a90c8; }
select.cfg-input { min-width: 120px; }

/* ── IO tab ── */
.io-section-title {
  font-size: 11px; font-weight: bold; color: #333;
  margin: 10px 0 4px;
}
.io-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
  background: white; border: 1px solid #ccc; padding: 6px;
  margin-bottom: 8px;
}
.io-cell {
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px 2px; cursor: pointer;
  border: 1px solid #e0e0e0; border-radius: 2px;
  background: #fafafa;
}
.io-cell:hover { background: #eef4ff; }
.io-led {
  width: 14px; height: 14px; border-radius: 50%;
  background: #d0d0d0; border: 1px solid #aaa;
}
.io-led.green { background: #22cc44; box-shadow: 0 0 4px #22cc44; border-color: #119922; }
.io-led.red   { background: #ee3333; box-shadow: 0 0 4px #ee3433; border-color: #991111; }
.io-led.yellow{ background: #eeaa11; box-shadow: 0 0 4px #eeaa11; border-color: #aa7700; }
.io-lbl { font-size: 9px; color: #555; text-align: center; line-height: 1.1; }

/* ── Sensor grid ── */
.sensor-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 6px;
  background: white; border: 1px solid #ccc; padding: 8px;
}
.sensor-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; border: 1px solid #e8e8e8; cursor: pointer;
}
.sensor-item:hover { background: #eef4ff; }
.s-led {
  width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  background: #d0d0d0; border: 1px solid #aaa;
}
.s-led.on { background: #22cc44; box-shadow: 0 0 5px #22cc44; }
.s-name { font-size: 10px; color: #333; }

/* ── Log encoder graph ── */
.log-graph {
  background: white; border: 1px solid #ccc;
  height: 180px; position: relative; overflow: hidden;
  margin-bottom: 8px;
}
.log-toolbar { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
.log-label { font-size: 11px; color: #555; }

/* ── Plain Windows buttons ── */
.win-btn {
  padding: 4px 18px;
  border: 1px solid #888; border-radius: 2px;
  background: #f0f0f0;
  font-family: inherit; font-size: 11px; color: #333;
  cursor: pointer; min-width: 75px;
}
.win-btn:hover { background: #e0e8f4; border-color: #4a90c8; }
.win-btn:active { background: #c8d8ec; }
.win-btn.disabled { color: #aaa; cursor: default; }
.win-btn.disabled:hover { background: #f0f0f0; border-color: #888; }

/* ── Maintenance sub-tabs ── */
.sub-tabs { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 10px; }
.sub-tab {
  padding: 4px 12px; font-size: 11px; cursor: pointer;
  border: 1px solid #ccc; border-bottom: none;
  background: #e0e0e0; margin-right: 2px; border-radius: 2px 2px 0 0;
  color: #333;
}
.sub-tab.active { background: white; font-weight: bold; }
.sub-tab:hover { background: #eee; }

/* ── Tables ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 11px; background: white; }
.data-table th {
  background: #dde8f0; padding: 4px 8px;
  text-align: left; border: 1px solid #bbb; font-weight: bold;
}
.data-table td { padding: 3px 8px; border: 1px solid #e0e0e0; vertical-align: middle; }
.data-table tr:hover td { background: #eef4ff; cursor: pointer; }
.data-table tr.even td { background: #f8f8f8; }

/* ── About ── */
.about-panel {
  background: white; border: 1px solid #ccc;
  padding: 20px; display: flex; gap: 20px; align-items: flex-start;
}
.about-logo-box {
  border: 1px solid #ccc; padding: 14px 18px; min-width: 200px; text-align: center;
}
.logo-be { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
.logo-be span { color: #006600; }
.logo-tagline { font-size: 12px; color: #555; font-style: italic; margin-top: 4px; }
.logo-circle { display: inline-block; width: 16px; height: 16px; background: #006600; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
.about-info p { font-size: 11px; margin-bottom: 5px; color: #333; }
.about-link { color: #006699; text-decoration: underline; cursor: pointer; font-size: 11px; }

/* ── Progress bar ── */
.prog-wrap { height: 14px; background: white; border: 1px solid #aaa; margin: 6px 0; }
.prog-fill { height: 100%; background: #4a90c8; width: 0%; transition: width 0.2s; }

/* ── Modal ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-bg.show { display: flex; }
.modal-win {
  background: #f0f0f0; border: 1px solid #888;
  box-shadow: 3px 3px 12px rgba(0,0,0,0.4); min-width: 320px;
}
.modal-titlebar {
  background: linear-gradient(to bottom, #4a90c8, #2060a0);
  color: white; padding: 4px 8px; font-size: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-body { padding: 16px; }
.modal-body label { font-size: 11px; }
.modal-footer { padding: 8px 12px; display: flex; justify-content: flex-end; gap: 6px; border-top: 1px solid #ddd; }
.modal-field { margin-bottom: 10px; }
.modal-field label { display: block; font-size: 11px; margin-bottom: 3px; color: #333; }
.modal-input {
  padding: 3px 6px; border: 1px solid #aaa; font-size: 11px;
  font-family: inherit; background: white; width: 100%;
}
.modal-group {
  border: 1px solid #aaa; padding: 10px; position: relative; margin-bottom: 12px; background: white;
}
.modal-group-title {
  position: absolute; top: -8px; left: 8px;
  background: white; padding: 0 4px; font-size: 11px; color: #333;
}
.modal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.modal-lbl { width: 180px; font-size: 11px; flex-shrink: 0; }

/* IO pulse buttons */
.pulse-row { display: flex; gap: 6px; margin-bottom: 8px; }
.io-controls { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }

/* Checkbox Windows style */
input[type=checkbox] { width: 12px; height: 12px; cursor: pointer; }

/* Settings table inline edit */
.set-val { padding: 2px 4px; border: 1px solid #bbb; font-size: 11px; width: 80px; font-family: inherit; }
</style>
</head>
<body>

<div class="window">

  <!-- Title bar -->
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-icon">BE</div>
      <span class="titlebar-text">Boon Edam Service Tool</span>
    </div>
    <div class="titlebar-btns">
      <div class="wbtn">─</div>
      <div class="wbtn">□</div>
      <div class="wbtn x">✕</div>
    </div>
  </div>

  <div class="body-row">

    <!-- Left quick menu -->
    <div class="quick-menu">
      <button class="qm-btn disabled" id="qb-upload" onclick="if(st.connected&&st.cfgDl)doUpload()">Upload<br>config</button>
      <button class="qm-btn disabled" id="qb-download" onclick="if(st.connected)doDownload()">Download<br>config</button>
      <button class="qm-btn disabled" id="qb-dlall" onclick="if(st.connected)doDownloadAll()">Download<br>all</button>
      <div class="qm-sep"></div>
      <button class="qm-btn" onclick="openDice()">Search<br>Dice code</button>
      <button class="qm-btn" onclick="openError()">Search<br>Error code</button>
      <div class="qm-sep"></div>
      <button class="qm-btn disabled" id="qb-ce" onclick="if(st.connected)openCE()">CE number</button>
      <div class="qm-sep"></div>
      <button class="qm-btn disabled" id="qb-ver" onclick="if(st.connected)openVersions()">Versions</button>
      <div class="qm-sep"></div>
      <button class="qm-btn" id="qb-conn" onclick="doConnect()">Connect</button>
      <button class="qm-btn disabled" id="qb-disc" onclick="doDisconnect()">Disconnect</button>
      <div class="qm-sep"></div>
      <select class="qm-dropdown" id="platformSel" onchange="st.platform=this.value">
        <option value="BC100">BC100</option>
        <option value="MicroBoon">MicroBoon</option>
        <option value="PLC">PLC</option>
      </select>
      <div class="qm-version" id="verLabel">Version: –</div>
      <div class="qm-crc">
        <label><input type="checkbox" id="crcChk" checked onchange="toggleCRC()"> CRC check</label>
      </div>
    </div>

    <!-- Right: tabs + content -->
    <div class="right-area">

      <!-- Tab strip -->
      <div class="tab-strip" id="tabStrip">
        <div class="tab active" id="tab-setup" onclick="switchTab('setup')">Setup</div>
        <div class="tab" id="tab-update" onclick="switchTab('update')">Update</div>
        <div class="tab" id="tab-config" onclick="switchTab('config')">Config</div>
        <div class="tab disabled" id="tab-io" onclick="guardedTab('io')">IO</div>
        <div class="tab disabled" id="tab-tools" onclick="guardedTab('tools')">Tools</div>
        <div class="tab disabled" id="tab-sensors" onclick="guardedTab('sensors')">Sensors</div>
        <div class="tab disabled" id="tab-manual" onclick="guardedTab('manual')">Manual</div>
        <div class="tab disabled" id="tab-settings" onclick="guardedTab('settings')">Settings</div>
        <div class="tab disabled" id="tab-audio" onclick="guardedTab('audio')">Audio settings</div>
        <div class="tab disabled" id="tab-options" onclick="guardedTab('options')">Options</div>
        <div class="tab disabled" id="tab-maint" onclick="guardedTab('maint')">Maintenance</div>
        <div class="tab" id="tab-about" onclick="switchTab('about')">About</div>
      </div>

      <!-- Content -->
      <div class="content" id="content"></div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span id="statusMsg">Ready</span>
    <span id="statusRight">C</span>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="bgClick(event)">
  <div class="modal-win" id="modalWin">
    <div class="modal-titlebar" id="modalTitle">Dialog</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="win-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

// ─── Status ───────────────────────────────────────────────────────────────────
function setStatus(msg){ document.getElementById('statusMsg').textContent = msg; }

// ─── Tab switching ────────────────────────────────────────────────────────────
function switchTab(tab) {
  if(st.ioIv && tab!=='io'){ clearInterval(st.ioIv); st.ioIv=null; st.ioRunning=false; }
  if(st.sensorIv && tab!=='sensors'){ clearInterval(st.sensorIv); st.sensorIv=null; st.sensorRunning=false; }
  if(st.logIv && tab!=='tools'){ clearInterval(st.logIv); st.logIv=null; st.logRunning=false; }
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const el = document.getElementById('tab-'+tab);
  if(el) el.classList.add('active');
  st.currentTab = tab;
  render(tab);
}
function guardedTab(tab){
  if(!st.connected){ setStatus('Connect to a machine first'); return; }
  switchTab(tab);
}

// ─── Renders ──────────────────────────────────────────────────────────────────
function render(tab){
  const c = document.getElementById('content');
  switch(tab){
    case 'setup':    c.innerHTML = rSetup(); break;
    case 'update':   c.innerHTML = rUpdate(); break;
    case 'config':   c.innerHTML = rConfig(); break;
    case 'io':       c.innerHTML = rIO(); break;
    case 'tools':    c.innerHTML = rTools(); break;
    case 'sensors':  c.innerHTML = rSensors(); break;
    case 'manual':   c.innerHTML = rManual(); break;
    case 'settings': c.innerHTML = rSettings(); break;
    case 'audio':    c.innerHTML = rAudio(); break;
    case 'options':  c.innerHTML = rOptions(); break;
    case 'maint':    c.innerHTML = rMaint(); break;
    case 'about':    c.innerHTML = rAbout(); break;
  }
  if(tab==='tools') { st.logData=[]; drawGraph(); }
}

function doConnect(){
  setStatus('Connecting...');
  setTimeout(()=>{
    st.connected=true;
    document.getElementById('verLabel').textContent='Version: 15783';
    // enable tabs
    ['io','tools','sensors','manual','settings','audio','options','maint'].forEach(t=>{
      const el=document.getElementById('tab-'+t);
      if(el) el.classList.remove('disabled');
    });
    // enable quick menu buttons
    ['qb-upload','qb-download','qb-dlall','qb-ce','qb-ver','qb-disc'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.classList.remove('disabled');
    });
    document.getElementById('qb-conn').classList.add('disabled');
    setStatus('Connected');
    render(st.currentTab);
  }, 1200);
}

function doDisconnect(){
  if(!st.connected) return;
  ['io','tools','sensors','manual','settings','audio','options','maint'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.classList.add('disabled');
  });
  ['qb-upload','qb-download','qb-dlall','qb-ce','qb-ver','qb-disc'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.add('disabled');
  });
  document.getElementById('qb-conn').classList.remove('disabled');
  document.getElementById('verLabel').textContent='Version: –';
  st.connected=false; st.cfgDl=false;
  setStatus('Disconnected');
  if(st.currentTab!=='setup'&&st.currentTab!=='update'&&st.currentTab!=='config'&&st.currentTab!=='about')
    switchTab('setup');
  else render(st.currentTab);
}

function runProgress(barId, fillId, cb, steps=12, delay=100){
  const bar=document.getElementById(barId), fill=document.getElementById(fillId);
  if(!bar||!fill) return;
  bar.style.display=''; let p=0;
  const iv=setInterval(()=>{
    p+=steps; fill.style.width=Math.min(p,100)+'%';
    if(p>=100){ clearInterval(iv); setTimeout(()=>{bar.style.display='none'; if(cb)cb();},300); }
  },delay);
}

function doDownload(){
  if(!st.connected) return;
  setStatus('Downloading configuration...');
  runProgress('setupProg','setupFill',()=>{ st.cfgDl=true; setStatus('Download success'); render('setup'); },12,100);
}

// Tools
let logStep=0;
function doLogEncoder(){
  const box=document.getElementById('toolsExtra');
  box.innerHTML=`<div style="font-size:11px;margin-bottom:6px">
    <button class="win-btn" id="logBtn" onclick="toggleLog()">Start log</button>
    <span id="logInfo" style="margin-left:10px;color:#555"></span>
  </div>
  <div class="log-graph"><canvas id="logCanvas" width="740" height="178"></canvas></div>`;
  st.logData=[]; drawGraph();
}
function toggleLog(){
  st.logRunning=!st.logRunning;
  const b=document.getElementById('logBtn'); if(b) b.textContent=st.logRunning?'Stop log':'Start log';
  if(st.logRunning){
    st.logIv=setInterval(()=>{
      const v=35+Math.sin(Date.now()/2000)*14+Math.random()*7;
      st.logData.push(v); if(st.logData.length>100) st.logData.shift();
      drawGraph();
      const el=document.getElementById('logInfo'); if(el) el.textContent=v.toFixed(1)+' rpm';
    },200);
  } else { clearInterval(st.logIv); st.logIv=null; }
}
function drawGraph(){
  const c=document.getElementById('logCanvas'); if(!c) return;
  const ctx=c.getContext('2d'), w=c.width, h=c.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='white'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=1;
  for(let g=0;g<=4;g++){ const y=h-g*(h/4); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); ctx.fillStyle='#888'; ctx.font='9px Arial'; ctx.fillText((g*20)+'',2,y-2); }
  if(!st.logData.length) return;
  ctx.beginPath(); ctx.strokeStyle='#006600'; ctx.lineWidth=2;
  st.logData.forEach((v,i)=>{ const x=i/(st.logData.length-1||1)*w, y=h-(v/80)*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
}

// ─── Modal helpers ────────────────────────────────────────────────────────────
function openModal(title, body, okCb, okLabel){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  const f=document.getElementById('modalFooter');
  f.innerHTML=okCb
    ? `<button class="win-btn" onclick="(${okCb.toString()})()">  ${okLabel||'OK'}  </button><button class="win-btn" onclick="closeModal()">Cancel</button>`
    : `<button class="win-btn" onclick="closeModal()">Close</button>`;
  if(okCb) f.querySelector('.win-btn').onclick=okCb;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
function bgClick(e){ if(e.target.id==='modalBg') closeModal(); }
